[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
license = { file = "LICENSE" }
name = "r1waw"
version = "0.2.0"
description = "Rank-One Writer-Adaptive Whitening: a per-writer similarity metric estimated from genuine samples only"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22"]

[project.optional-dependencies]
verifier = ["scikit-learn>=1.2"]
test = ["pytest", "scikit-learn>=1.2"]

[tool.setuptools]
packages = ["r1waw"]
